name: Update age

on:
  schedule:
    - cron: "17 0 * * *" 
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Recalculate age
        run: python3 scripts/update_age.py README.md

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: update age"
            git push
          fi

      - name: Keep schedule alive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable update-age.yml --repo "$GITHUB_REPOSITORY"
